[project]
name = "videodistill"
version = "0.1.0"
description = "Domain-agnostic video distillation: fuse ASR and on-screen visuals into a reviewable digest."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ayshine" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    # 0.7 introduced a Timecode/POS_MSEC path that returns NaN on some OpenCV
    # builds; the mature 0.6.x line derives timecodes from frame number x fps.
    "scenedetect>=0.6.4,<0.7",
    # scenedetect pulls in opencv-python unpinned; OpenCV 5.x reports NaN frame
    # timestamps that break scene detection, so pin to the stable 4.x line.
    "opencv-python<5",
    "openai>=1.30",
    "pillow>=10.0",
    "imagehash>=4.3",
    "qdrant-client>=1.7",
    "rank-bm25>=0.2",
    "python-dotenv>=1.0",
    # onnxruntime (pulled in by faster-whisper's VAD) dropped x86_64 macOS
    # wheels after 1.19; pin so Intel Macs can still resolve. Remove once the
    # project targets arm64/Linux only.
    "onnxruntime<1.20",
    "google-genai>=2.16.0",
]

[project.scripts]
videodistill = "videodistill.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videodistill"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer requires function calls (Argument/Option) as parameter defaults.
"videodistill/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "scenedetect.*",
    "imagehash.*",
    "rank_bm25.*",
]
ignore_missing_imports = true

# numpy is only a transitive dependency (via faster-whisper). Its bundled stubs
# use 3.12-only `type` syntax, so don't type-check through it.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
